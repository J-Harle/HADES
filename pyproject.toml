[tool.hades]
name = "HADES"
description = "High-throughput Analysis for the Design of Energetic Systems"
version = "1.0.0"
authors = ["Joshua T. Harle 13jharle@gmail.com"]
license = "MIT"

[tool.hades.dependencies]
python = ">=3.8"
argparse = "*"
subprocess = "*"
os = "*"
sys = "*"
rdkit = ">=2025.3.6"
numpy = "*"
pandas = "*"
matplotlib = "*"
scikit-learn = "*"
torch = "*"

[tool.hades.settings]
input_default = "None"
output_default = "hades_out.csv"