[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hades-em"
version = "0.1.0"
description = "High-throughput Analysis for the Design of Energetic Systems"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Joshua T. Harle"},
]
keywords = [
    "computational chemistry",
    "energetic materials",
    "molecular design",
    "thermochemistry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "ase>=3.23",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26,<3",
    "pandas>=2.0",
    "rdkit>=2024.3",
    "scikit-learn==1.6.1",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
mace = [
    "mace-torch>=0.3.14",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
dev = [
    "build>=1.2",
    "ruff>=0.9",
]

[project.scripts]
hades = "hades:main"

[project.urls]
Homepage = "https://github.com/J-Harle/HADES"
Documentation = "https://github.com/J-Harle/HADES#readme"
Issues = "https://github.com/J-Harle/HADES/issues"
Repository = "https://github.com/J-Harle/HADES.git"

[tool.setuptools]
include-package-data = true
py-modules = ["hades"]

[tool.setuptools.packages.find]
include = ["MODULES*"]

[tool.setuptools.package-data]
MODULES = [
    "TOOLS/DENSITY/*.pkl",
    "TOOLS/EOF/*.csv",
    "TOOLS/SUBSTITUTION/*.txt",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
